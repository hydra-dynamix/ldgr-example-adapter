[package]
name = "ldgr-example-adapter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/hydra-dynamix/ldgr-example-adapter"
description = "Reference LDGR adapter used to exercise adapter lifecycle extension points."

[[bin]]
name = "ldgr-example-adapter"
path = "src/main.rs"

[dependencies]
ldgr = { package = "ldgr-core", git = "https://github.com/hydra-dynamix/ldgr-core", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
serde_json = "1.0"
