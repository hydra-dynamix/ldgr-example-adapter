[adapter]
slug = "community-sample"
title = "Community Sample Adapter"
core_version = "0.1"
aliases = ["sample", "community"]

[profile]
loop_prompt_path = "prompts/ldgr-loop-next-work.md"
default_milestone_template = "templates/milestones.md"
spec_artifact_path = "templates/sample-spec.md"
readiness_policy = "The sample adapter is ready when its prompt, template, tool, and target profile records can be loaded through the public adapter manifest path."

[[tools]]
name = "community-sample-check"
argv = ["community-sample", "check"]
description = "Run the sample adapter's public validation command."

[[commands]]
namespace = "community-sample"
argv = ["community-sample"]
aliases = ["sample", "community"]
title = "Community sample commands"
description = "Community adapter commands exposed under the core LDGR command surface."
capabilities = ["dispatch", "help"]

[commands.help]
usage = "ldgr community-sample <command> [options]"
summary = "Run community sample adapter commands."
details = "Core dispatches arguments after the community-sample namespace to the adapter executable."

[[target_profiles]]
slug = "community-sample-lifecycle"
title = "Community sample lifecycle"
target_type = "community-adapter"
description = "A public target profile for validating adapter installation, discovery, and profile application."

[[target_profiles.probes]]
slug = "manifest-loads"
title = "Manifest loads"
description = "The adapter manifest parses and all referenced profile files resolve relative to the manifest directory."
evidence_artifact_kind = "command_observation"
expectation_template = "profile discover lists community-sample and profile apply loads community-sample-lifecycle."
validation_hint = "ldgr-example-adapter profile discover && ldgr-example-adapter profile apply community-sample"
